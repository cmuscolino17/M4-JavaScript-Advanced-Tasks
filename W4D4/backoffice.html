<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My E-commerce</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/styleback.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg nav-custom mb-5 ">
    <div class="container-fluid">
      <img src="./img/logo_modificato.png" alt="log" class="img">
      <a class="navbar-brand fw-medium">Epic Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav nav-link-custom">
          <a class="nav-link" aria-current="page" href="./index.html">Home</a>
          <a class="nav-link" href="#">Backoffice</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Input per aggiungere prodotti -->
  <div class="container">
    <div class="row" id="">
      <div class="col-12 col-md-6">
        <form>
          <input type="text" class="form-control mb-3" placeholder="Name" id="name-product">
          <input type="text" class="form-control mb-3" placeholder="Description" id="description-product">
          <input type="text" class="form-control mb-3" placeholder="Img" id="img-product">
          <div class="d-flex gap-2 mb-3">
            <input type="text" class="form-control mb-3" placeholder="Brand" id="brad-product">
            <input type="text" class="form-control mb-3" placeholder="Price" id="price-product">
          </div>
          <button class="btn btn-outline-success mb-3" type="submit" id="add-btn">Add new product</button>
        </form>
      </div>
    </div>
    <div id="product-list">
    </div>

    <!-- Spinner per attese -->
    <div id="spinner" class="text-center my-3 d-none">
      <div class="spinner-border custom-spinner" role="status">
      </div>
    </div>

    <!-- Tabella dei prodotti -->
    <table id="table-product" class="table table-striped table-hover table-custom c">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Brand</th>
          <th>ImgUrl</th>
          <th>Price</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>

    <!-- Modale di modifica -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Product</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="edit-form">
              <input type="text" class="form-control mb-3" placeholder="Nome prodotto" id="edit-name-product"
                name="name">
              <input type="text" class="form-control mb-3" placeholder="Descrizione prodotto"
                id="edit-description-product" name="description">
              <input type="text" class="form-control mb-3" placeholder="Brand" id="edit-brad-product" name="brand">
              <input type="text" class="form-control mb-3" placeholder="Img prodotto" id="edit-img-product"
                name="imageUrl">
              <input type="text" class="form-control mb-3" placeholder="Prezzo prodotto" id="edit-price-product"
                name="price">
              <button type="submit" class="btn btn-primary mb-2" id="saveEditBtn">
                <span id="saveEditText">Salva modifiche</span>
                <span id="saveEditSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"
                  aria-hidden="true"></span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>





  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="./js/scriptback.js"></script>
</body>

</html>
